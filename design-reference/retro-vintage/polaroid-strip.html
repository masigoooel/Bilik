<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Polaroid Strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#22305C}a:hover{color:#121a36}
</style>
</helmet>
<div style="position: relative; width: 600px; height: 1800px; box-sizing: border-box; padding: 52px 0 44px; background: {{bg}}; display: flex; flex-direction: column; align-items: center; gap: 32px; font-family: 'IBM Plex Mono', 'Courier New', monospace; color: #22305C">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="3">
<div style="position: relative; width: 460px; box-sizing: border-box; padding: 18px 18px 0; background: linear-gradient(180deg, #fbfaf6, #f1eee6); box-shadow: 0 1px 1px rgba(0,0,0,0.12), 0 8px 18px rgba(34,48,92,0.22), inset 0 0 0 1px rgba(0,0,0,0.04); transform: rotate({{p.tilt}})">
<div style="position: absolute; display: {{p.tape}}; left: 160px; top: -18px; width: 140px; height: 38px; background: rgba(240,232,200,0.8); transform: rotate(-3deg)"></div>
<div style="position: relative; width: 424px; height: 424px; background: #E6E9F0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15), inset 0 4px 10px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #5A6480">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
<div style="font-size: 18px">{{p.label}}</div>
<div style="position: absolute; right: 14px; bottom: 10px; font-family: 'Courier New', monospace; font-size: 22px; font-weight: 700; color: #FF8A1F">'26 10 17</div>
</div>
<div style="height: 72px; display: flex; align-items: center; justify-content: center; font-family: 'Caveat', cursive; font-size: 34px; font-weight: 700; color: #1F4FC0">{{p.caption}}</div>
</div>
</sc-for>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px">
<div style="font-family: 'Caveat', cursive; font-size: 44px; font-weight: 700; line-height: 1">17 Oktober</div>
<div style="font-size: 16px; letter-spacing: 0.25em">17.10.2026</div>
</div>
<div data-texture="1" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.14; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22300%22%20height%3D%22300%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.9%22%20numOctaves%3D%222%22%20stitchTiles%3D%22stitch%22/%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22/%3E%3C/filter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22/%3E%3C/svg%3E'); background-size: 300px 300px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#C9D7F5","options":["#C9D7F5","#F5D0C5","#D4EBD0","#22305C"]},"$preview":{"width":600,"height":1800}}'>
class Component extends DCLogic {
renderVals() {
return {
bg: this.props.bg ?? '#C9D7F5',
photos: [
{ label: 'Foto 1', caption: '01', tilt: '-2deg', tape: 'none' },
{ label: 'Foto 2', caption: '02', tilt: '1.8deg', tape: 'block' },
{ label: 'Foto 3', caption: '03', tilt: '-1.4deg', tape: 'none' }
]
};
}
}
</script>
</body>
</html>
