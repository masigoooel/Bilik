<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Buku Panduan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&amp;family=Space+Mono:wght@400;700&amp;family=Caveat:wght@700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2A3A}a:hover{color:#000}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1350px; background: radial-gradient(ellipse at 40% 30%, #f3ede2, {{bg}} 75%); font-family: 'Space Mono', monospace; color: #1E2A3A; overflow: hidden">
<div style="position: absolute; left: 180px; top: 90px; width: 720px; height: 1100px; display: flex; box-shadow: 0 26px 40px rgba(0,0,0,0.3); transform: rotate(-2deg)">
<div style="width: 50px; background: linear-gradient(90deg, #a8332a, {{c}} 40%, #a8332a)"></div>
<div style="position: relative; flex: 1; background: {{c}}; padding: 46px 44px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; color: #F6F1E4">
<div style="display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 0.2em"><span>PANDUAN SAKU</span></div>
<span style="font-family: 'Libre Caslon Text', Georgia, serif; font-weight: 700; font-size: 96px; line-height: 0.9">[KOTA]</span>
<span style="font-size: 16px">tempat makan, jalan kaki, dan sudut tersembunyi</span>
<div style="padding: 10px; background: #F6F1E4"><div style="height: 520px; flex-shrink: 0; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), inset 0 3px 8px rgba(0,0,0,0.16); background: #E5E0D4; border: none; border-radius: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #5f5c56"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg><div style="font-size: 18px; font-weight: 700">FOTO</div></div></div>
<div style="flex: 1; display: flex; justify-content: space-between; align-items: flex-end; font-size: 13px"><span>oleh [NAMA]</span><span>termasuk peta lipat</span></div>
</div></div>
<div style="position: absolute; left: 860px; top: 120px; width: 24px; height: 1060px; background: repeating-linear-gradient(0deg, #F6F1E4 0 3px, #e3dcc6 3px 5px); transform: rotate(-2deg); box-shadow: inset 4px 0 6px rgba(0,0,0,0.15)"></div><div style="position: absolute; left: 640px; top: 1186px; width: 34px; height: 120px; background: linear-gradient(90deg, #2E5E8C, #1E3A5A); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); transform: rotate(-2deg)"></div><div data-texture="1" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.1; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22300%22%20height%3D%22300%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.9%22%20numOctaves%3D%222%22%20stitchTiles%3D%22stitch%22/%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22/%3E%3C/filter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22/%3E%3C/svg%3E'); background-size: 300px 300px"></div><div data-detail="1" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 25% 15%, rgba(255,240,210,0.22), transparent 45%), radial-gradient(ellipse at 50% 55%, transparent 60%, rgba(0,0,0,0.14) 100%)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg": {"editor": "color", "default": "#D9CFBE", "options": ["#D9CFBE", "#C9D6E0", "#E0CFC9"]}, "c": {"editor": "color", "default": "#C0392B", "options": ["#C0392B", "#2E5E8C", "#3C7A55", "#E8A33C"]}, "$preview": {"width": 1080, "height": 1350}}'>
class Component extends DCLogic {
renderVals() {
return { bg: this.props.bg ?? '#D9CFBE', c: this.props.c ?? '#C0392B' };
}
}
</script>
</body>
</html>
