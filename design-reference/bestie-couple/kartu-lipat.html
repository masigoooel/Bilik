<head>

<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#1f1d1a}a:hover{color:#000}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1350px; box-sizing: border-box; padding: 100px 70px; background: {{bg}}; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; color: #1f1d1a">
<div style="width: 940px; height: 1080px; display: grid; grid-template-columns: 1fr 1fr; box-shadow: 0 24px 50px rgba(0,0,0,0.2)">
<div style="background: #FBF8F1; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; box-shadow: inset -14px 0 20px -14px rgba(0,0,0,0.25)"><div style="height: 760px; flex-shrink: 0; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), inset 0 3px 8px rgba(0,0,0,0.16); background: #ECE8E1; border: none; border-radius: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #5f5c56"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg><div style="font-size: 18px; font-weight: 700">FOTO 1</div></div><span style="font-family: 'Caveat', cursive; font-size: 40px">waktu itu,</span></div>
<div style="background: #FBF8F1; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; box-shadow: inset 14px 0 20px -14px rgba(0,0,0,0.18)"><div style="height: 760px; flex-shrink: 0; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), inset 0 3px 8px rgba(0,0,0,0.16); background: #ECE8E1; border: none; border-radius: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #5f5c56"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg><div style="font-size: 18px; font-weight: 700">FOTO 2</div></div><div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Caveat', cursive; font-size: 40px">sekarang.</span><span style="font-family: 'DM Serif Display', Georgia, serif; font-size: 26px; color: {{c}}">[NAMA]</span></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg": {"editor": "color", "default": "#E8C8C0", "options": ["#E8C8C0", "#C8D6E8", "#D6E8C8"]}, "c": {"editor": "color", "default": "#C0392B", "options": ["#C0392B", "#2E6DA4", "#1f1d1a"]}, "$preview": {"width": 1080, "height": 1350}}'>
class Component extends DCLogic {
renderVals() {
return { bg: this.props.bg ?? '#E8C8C0', c: this.props.c ?? '#C0392B' };
}
}
</script>
