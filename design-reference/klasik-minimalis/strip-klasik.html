<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Strip Klasik</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1a1a1a}a:hover{color:#000}
</style>
</helmet>
<div style="position: relative; width: 600px; height: 1800px; box-sizing: border-box; padding: 40px 40px 48px; background: #ffffff; display: flex; flex-direction: column; gap: 30px; font-family: 'IBM Plex Mono', 'Courier New', monospace; color: #1a1a1a">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="4">
<div style="width: 520px; height: 335px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10), inset 0 3px 8px rgba(0,0,0,0.14), 0 1px 0 rgba(255,255,255,0.6); background: #e9e7e3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #6b6760">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
<div style="font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{p.label}}</div>
</div>
</sc-for>
<div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; text-align: center">
<div style="width: 64px; height: 6px; background: {{accent}}; margin-bottom: 18px"></div>
<div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 64px; text-shadow: 0 1px 0 rgba(255,255,255,0.55), 0 -1px 0 rgba(0,0,0,0.12); font-weight: 400; line-height: 1">momen kita</div>
<div style="font-size: 20px; font-weight: 400; letter-spacing: 0.3em; color: #55524c">17 · 10 · 2026</div>
<div style="width: 100%; display: flex; justify-content: space-between; margin-top: 18px; padding-top: 14px; border-top: 1px solid #d9d6d0; font-size: 15px; color: #55524c"><span>No. 0017</span><span>4 frame</span><span>16:20</span></div>
</div>
<div data-texture="1" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.09; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22300%22%20height%3D%22300%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.9%22%20numOctaves%3D%222%22%20stitchTiles%3D%22stitch%22/%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22/%3E%3C/filter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22/%3E%3C/svg%3E'); background-size: 300px 300px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8553D","options":["#E8553D","#1F6FEB","#1a1a1a","#2F9E6B"]},"$preview":{"width":600,"height":1800}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#E8553D',
photos: [{ label: 'Foto 1' }, { label: 'Foto 2' }, { label: 'Foto 3' }, { label: 'Foto 4' }]
};
}
}
</script>
</body>
</html>
