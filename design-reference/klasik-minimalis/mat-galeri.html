</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg": {"editor": "color", "default": "#D9D5CC", "options": ["#D9D5CC", "#2B2B2B", "#B9C2C6"]}, "$preview": {"width": 1080, "height": 1350}}'>
class Component extends DCLogic {
renderVals() {
return { bg: this.props.bg ?? '#D9D5CC' };

}
