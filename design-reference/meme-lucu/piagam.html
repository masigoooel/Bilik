<span style="font-family: 'Anton', Impact, sans-serif; font-size: 44px">[BIDANG PRESTASI]</span>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 18px">17.10.2026</span><div style="width: 220px; height: 2px; background: #2a2118"></div><span style="font-size: 13px">tanggal</span></div></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg": {"editor": "color", "default": "#2E4A3A", "options": ["#2E4A3A", "#5A1E24", "#1E2A4A"]}, "$preview": {"width": 1080, "height": 1350}}'>

}
}
