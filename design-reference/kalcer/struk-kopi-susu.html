<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Struk Kopi Susu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2b2a27}a:hover{color:#000}
</style>
</helmet>
<div style="position: relative; width: 600px; height: 1800px; box-sizing: border-box; padding: 30px 30px; background: {{bg}}; display: flex; flex-direction: column; font-family: 'Space Mono', 'Courier New', monospace; color: #2b2a27">
<div style="height: 14px; background: linear-gradient(135deg, transparent 7px, #FBFAF6 0) 0 0 / 14px 14px, linear-gradient(225deg, transparent 7px, #FBFAF6 0) 0 0 / 14px 14px"></div>
<div style="flex: 1; box-sizing: border-box; padding: 26px 26px 20px; background: #FBFAF6; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<div style="font-family: 'VT323', monospace; font-size: 52px; line-height: 1">KEDAI KOPI SUSU</div>
<div style="font-size: 14px">Jl. [ALAMAT] · 08.00–22.00</div>
<div style="font-size: 14px">17/10/26 · 16:20 · kasir 01</div>
</div>
<div style="border-top: 2px dashed #2b2a27"></div>
<sc-for list="{{photos}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 370px; background: #E7E3D8; filter: grayscale(1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #6a665c">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
<div style="font-size: 16px; font-weight: 700">{{p.label}}</div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 17px; font-weight: 700"><span>{{p.item}}</span><span>{{p.price}}</span></div>
</div>
</sc-for>
<div style="border-top: 2px dashed #2b2a27"></div>
<div style="display: flex; justify-content: space-between; font-family: 'VT323', monospace; font-size: 40px; line-height: 1"><span>TOTAL</span><span>3 FOTO</span></div>
<div style="display: flex; justify-content: space-between; font-size: 15px"><span>BAYAR</span><span>TUNAI</span></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; text-align: center">
<div style="font-size: 15px; font-weight: 700">TERIMA KASIH</div><div style="width: 300px; height: 46px; background: repeating-linear-gradient(90deg, #2b2a27 0 3px, transparent 3px 5px, #2b2a27 5px 6px, transparent 6px 10px, #2b2a27 10px 14px, transparent 14px 16px)"></div>
<div style="font-size: 13px">No. 0017 · simpan struk ini</div>
</div>
</div>
<div style="height: 14px; background: linear-gradient(45deg, transparent 7px, #FBFAF6 0) 0 0 / 14px 14px, linear-gradient(-45deg, transparent 7px, #FBFAF6 0) 0 0 / 14px 14px"></div>
<div style="position: absolute; left: 60px; top: 1560px; width: 170px; height: 170px; border-radius: 50%; border: 12px solid rgba(120,80,40,0.16); box-sizing: border-box"></div>
<div data-texture="1" style="position: absolute; inset: 0; pointer-events: none; opacity: 0.14; mix-blend-mode: multiply; background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22300%22%20height%3D%22300%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.9%22%20numOctaves%3D%222%22%20stitchTiles%3D%22stitch%22/%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22/%3E%3C/filter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22/%3E%3C/svg%3E'); background-size: 300px 300px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#B8916A","options":["#B8916A","#2b2a27","#6E8B74","#D9D4C7"]},"$preview":{"width":600,"height":1800}}'>
class Component extends DCLogic {
renderVals() {
return {
bg: this.props.bg ?? '#B8916A',
photos: [
{ label: 'FOTO 1', item: 'FRAME 01', price: '16:20' },
{ label: 'FOTO 2', item: 'FRAME 02', price: '16:20' },
{ label: 'FOTO 3', item: 'FRAME 03', price: '16:21' }
]
};
}
}
</script>
</body>
</html>
