<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F03C","options":["#C8F03C","#FF6A2B","#FF4FA3","#4FB3FF"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
const pattern = [3,1,2,4,1,1,3,2,1,4,2,1,1,3,1,2,4,1,2,1,3,1,1,4,2,1,3,2,1,1,4,1,2,3,1,2,1,4,1,3];

return { accent: this.props.accent ?? '#C8F03C', bars: bars };
}
