<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kotak Game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen&amp;family=Space+Mono:wght@400;700&amp;family=Outfit:wght@700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#000}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1350px; background: radial-gradient(ellipse at 40% 30%, #3a3a5a, {{bg}} 75%); font-family: 'Silkscreen', monospace; color: #fff; overflow: hidden"><div style="position: absolute; left: 860px; top: 200px; width: 180px; height: 180px; border-radius: 50%; background: conic-gradient(from 30deg, #e9edf2, #d8e8f6, #f6d8e6, #e6f6d8, #e9edf2); box-shadow: 0 6px 10px rgba(0,0,0,0.4), inset 0 0 0 64px rgba(255,255,255,0.1); z-index: 0"><div style="margin: 70px auto 0; width: 40px; height: 40px; border-radius: 50%; background: #12122A"></div></div>
<div style="position: absolute; left: 180px; top: 80px; width: 720px; height: 1150px; border-radius: 16px; background: linear-gradient(90deg, #1a1a1a, #2a2a2a 6%, #1a1a1a 100%); box-shadow: 0 30px 50px rgba(0,0,0,0.5); transform: rotate(-2deg)">
<div style="position: absolute; left: 30px; top: 26px; right: 26px; bottom: 26px; background: {{c}}; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 70px; background: #fff; color: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-family: 'Press Start 2P', monospace; font-size: 18px"><span>KONSOL</span><span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px">17+</span></div>
<div style="position: relative; flex: 1"><div style="height: 760px; flex-shrink: 0; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), inset 0 3px 8px rgba(0,0,0,0.16); background: #2a2a44; border: none; border-radius: 0px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #9a9ac0"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg><div style="font-family: 'Silkscreen', monospace; font-size: 18px; font-weight: 700">FOTO</div></div><div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7))"></div>
<div style="position: absolute; left: 30px; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 76px; line-height: 0.9; text-shadow: 0 4px 0 rgba(0,0,0,0.5)">[JUDUL GAME]</span><span style="font-size: 18px">dibintangi [NAMA]</span></div></div>
<div style="height: 120px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; color: #cfcfcf"><span>1–2 pemain · simpan otomatis</span><div style="padding: 8px 12px; border: 2px solid #cfcfcf; font-family: 'Press Start 2P', monospace; font-size: 10px">EDISI KOLEKTOR</div></div></div>
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 16px; background: linear-gradient(120deg, rgba(255,255,255,0.18), transparent 30%); pointer-events: none"></div></div><div style="position: absolute; left: 150px; top: 90px; width: 40px; height: 1150px; background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.35) 40%, rgba(255,255,255,0.08)); transform: rotate(-2deg)"></div><div data-detail="1" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(125deg, transparent 28%, rgba(255,255,255,0.18) 40%, transparent 52%)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg": {"editor": "color", "default": "#12122A", "options": ["#12122A", "#1A0E14", "#0E1A12"]}, "c": {"editor": "color", "default": "#2F6BFF", "options": ["#2F6BFF", "#E2368A", "#18A05A", "#E8A33C"]}, "$preview": {"width": 1080, "height": 1350}}'>
class Component extends DCLogic {
renderVals() {
return { bg: this.props.bg ?? '#12122A', c: this.props.c ?? '#2F6BFF' };
}
}
</script>
</body>
</html>
